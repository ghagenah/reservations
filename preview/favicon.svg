<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Clock">
  <!--
    A clock rather than a calendar: this books hours, not days.

    Solid disc with cut-out hands rather than an outlined face — at 16px in a
    tab a 1px ring disappears. The hands sit at 3 o'clock because
    perpendicular reads clearly at that size, where hands at a narrow angle
    (10:10) merge into one mark. No centre pin or tick marks: both are smaller
    than a pixel there.

    The disc lightens in dark mode. UCSC Primary Blue is dark enough to vanish
    against a dark tab strip, and a favicon has no page behind it to borrow
    contrast from.
  -->
  <style>
    .face { fill: #003c6c; }
    .hand { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .face { fill: #6ea8d4; }
      .hand { fill: #0e1c28; }
    }
  </style>

  <circle class="face" cx="16" cy="16" r="14"/>

  <!-- minute hand, straight up -->
  <rect class="hand" x="14" y="7" width="4" height="11" rx="2"/>
  <!-- hour hand, to 3 -->
  <rect class="hand" x="14" y="14" width="4" height="9" rx="2"
        transform="rotate(-90 16 16)"/>
</svg>
